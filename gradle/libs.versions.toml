reoqoo-lib-widget =           { group = "com.reoqoo.gw_plugin_hub", name = "lib_widget",           version.ref = "reoqoo-sdk" }
reoqoo-lib-utils =            { group = "com.reoqoo.gw_plugin_hub", name = "lib_utils",            version.ref = "reoqoo-sdk" }
reoqoo-lib-http =             { group = "com.reoqoo.gw_plugin_hub", name = "lib_http",             version.ref = "reoqoo-sdk" }
