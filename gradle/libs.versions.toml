wheel-picker = { module = "cn.aigestudio.wheelpicker:WheelPicker", version.ref = "wheel-picker" }
auto-size = { module = "me.jessyan:autosize", version.ref = "auto-size" }

# ============== Kotlin ==============
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt-android" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt-android" }

[bundles]
androidx-ui = ["androidx-appcompat", "androidx-recyclerview", "material"]
androidx-lifecycle = ["androidx-lifecycle-livedata", "androidx-lifecycle-livedata-ktx", "androidx-lifecycle-viewmodel-ktx"]