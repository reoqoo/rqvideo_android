targetsdk = "36"
minsdk = "24"
buildtools = "34.0.0"
kotlin = "2.2.20"
navigation-plugin = "2.5.3"
agp = "8.9.1"

# jetbrains官方的
kotlin-coroutines = "1.7.1"
kotlin-serialization = "1.7.3"

# ============== AndroidX Versions ==============
appcompat = "1.7.1"
fragment-ktx = "1.4.1"
recyclerview = "1.2.1"
lifecycle = "2.5.1"
lifecycle-extensions = "2.2.0"
lifecycle-common = "2.4.0"
navigation = "2.5.0"
kotlin-core = "1.16.0"
material = "1.5.0"
constraintlayout = "2.1.4"
cardview = "1.0.0"
paging-runtime = "3.1.1"
