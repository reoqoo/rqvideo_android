gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-message" }
phoenix = { module = "com.jakewharton:process-phoenix", version.ref = "phoenix" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
