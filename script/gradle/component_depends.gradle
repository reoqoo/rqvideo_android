dependencies {
    implementation(project(":lib_modules:lib_api_root"))
    implementation(project(":lib_modules:lib_resource"))

    api(libs.reoqoo.lib.module.mounter)
    api(libs.reoqoo.lib.datastore)
    api(libs.reoqoo.lib.router)
    api(libs.reoqoo.lib.widget)
    api(libs.reoqoo.lib.utils)
    api(libs.reoqoo.lib.http)
